[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rogue-assistant"
version = "0.1.0"
description = "A personalizable multi-LLM AI assistant CLI"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "google-genai>=0.7.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.0",
    "pyfiglet>=1.0.2",
    "requests>=2.31.0",
]

[project.optional-dependencies]
imagen = [
    "google-cloud-aiplatform>=1.60.0",
]

[project.scripts]
rogue-assistant = "rogue_assistant.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["rogue_assistant*"]
